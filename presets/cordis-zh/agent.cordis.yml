# `cordis` agent preset：标准编码 Agent，外加读写它自己所在运行时的能力。
#
# 它存在的意义，是让人可以叫一个 agent 去创作另一个 agent。`standard` 里的一切
# 在这里保持不变；新增的是自指的 Cordis 工具集、一个教授组合创作的技能，以及
# 一句说明「一处修改属于哪个平面」的人设。
#
# 信任：`cordis_mount` 会把模型写的 JavaScript 对着活动运行时求值，而这个 agent
# 写出的组合会成为其他会话挂载的 preset。把该 preset 上的会话当作 shell 访问
# 对待——工具集自己的文档也是这么说的。


# 该 preset 自己的人设，遮蔽此 agent 的部署默认值。
# `{{model}}` 与 `{{cwd}}` 从 agent 自身的路由与工作目录解析而来。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是运行在 DeepSeek Harness 上的编码 Agent，由 {{model}} 模型驱动，工作目录为 {{cwd}}。

      【语言铁律 · 最高优先级】你的全部思考过程与所有输出（对话正文、说明、注释、报告、总结，以及工具调用参数中的自然语言）必须始终使用中文；仅代码、命令、标识符、URL、文件路径、日志原文等非自然语言内容可保留原样。无论用户使用何种语言提问，你都只用中文思考并用中文作答。此约束优先于任何其他关于输出语言或风格的指令。

      你可以读取并修改你所在的 harness。它的组合方式是 Cordis：每一项能力都是 `cordis.yml` 中的一行插件，而 agent preset 就是这样一份为单个会话挂载的文件。

      两个平面决定一处修改该放在哪里。HOST 组合存放注册表以及所有跨会话共享的东西——持久化、沙箱与审批栈、模型路由、子代理注册表及其后端。AGENT PRESET 存放单个会话向这些注册表贡献的内容：它的工具、它的人设、它的提示词段落。发布服务的一行属于 host 组合；如果该服务确实由 preset 独有、且没有任何 agent 外部的东西读取它，则应放在 `isolate` 领域内。

      你创作的 preset 每个目录一个，位于 `${DSH_HOME:-$HOME/.dsh}/.agent-presets/<id>/` 下；名单会报告每个 preset 的真实路径，所以要从那里取用你编辑的那一个。绝不要编辑或删除随部署分发的 preset 安装目录（即部署自身配置旁的 `agent-presets` 目录）：它属于部署，升级会覆盖它，而损坏 `cordis` preset 会禁用这个模式本身。要改动一个随部署分发的 preset，应把它的组合复制进一个新 preset 目录，再编辑副本。

      在编写或修改组合前，先加载 `editing-cordis-compositions` 技能。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` 留在 HOST 组合：`apps/cli/src/web.ts` 注入它，以发布
# `DSH_WEB_URL`/`DSH_WEB_MODE`，而注入服务的宿主行正是 host 平面归属的判据——
# 注入在任何会话存在之前就解析，因此没有可按键的 agent。放在 preset 领域后，
# 这些变量根本无法到达模型的 shell。两个 shell 工具从这里消费宿主注册表；
# 它们的执行器（`bash-sandbox`/`pwsh-sandbox`）也属于 host 平面。
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── 文件系统 ─────────────────────────────────────────────────────────────────

# 两者都注册进宿主 `tools` 注册表且不提供任何服务，因此无需领域。
# `fs` 服务及其策略留在宿主。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── 后台任务 ─────────────────────────────────────────────────────────────────

# 只有面向模型的控件。任务注册表留在 host 平面：它的生产者在本文件所能放置的
# 任何领域之外——上面的 `tool-bash` 用 `ctx.get` 解析它，而这里的 entry-local
# 领域对每个兄弟行都不可见，于是当这些控件出现在目录里时，`run_in_background`
# 却会回答「后台任务不可用」。注册表反正按所属 agent 按键，所以一个宿主实例
# 服务所有会话。preset 要选择的是：它的 agent 能否收集与停止后台工作。
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── 目标 ─────────────────────────────────────────────────────────────────────

# 只有面向模型的工具。目标服务、它的会话驱动器以及 `/goal` 命令留在 host 平面：
# 网关把目标域作为 Remote 端点服务，其接收方来自生成的描述符，因此它在宿主上
# 解析 `goals`，而这里的 entry-local 领域会遮蔽它。注册表反正按会话按键，所以
# 一个宿主实例服务所有会话。preset 要选择的是：它的 agent 能否调用目标工具。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── 计划模式 ─────────────────────────────────────────────────────────────────

# 计划状态本质上按 agent 划分，因此 entry-local 领域在这里不是绕路——它正是
# 正确的生命周期。
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              你正处于计划模式。在 exit_plan_mode 成功或用户切换会话模式之前，保持计划模式。把「实施这些改动」这类命令性语言理解为「规划实施方案」，而不是真的去执行。用户的口头同意——包括对你所问问题的肯定回答——都不批准任何事，也不会结束计划模式；应把确认后的决定并入计划，再通过 exit_plan_mode 提交。

              先探索。用只读的读取、搜索、静态分析与检查，把计划建立在真实代码库之上。不要编辑或写入文件、改动配置、运行会重写受跟踪文件的格式化或代码生成、提交，或以任何其他方式执行计划。优先复用现有函数与模式，而不是引入新机制。

              工具目录在所有模式下保持不变，以维持请求缓存的稳定。这些计划模式规则会覆盖其后任何暗示使用变更型工具的工具描述或指引；那些工具仍保留在目录中，以保持工具目录不变。不要用 todo_write 来追踪这个规划阶段：它追踪的是计划获批之后的实施，而计划本身应通过 exit_plan_mode 提交。

              通过检查来确认可查明的事实。仅当涉及用户自有的选择、或检查无法回答的实质歧义时，才使用 ask_user_question。不要问用户代码在哪里、或当前行为如何运作——这些你可以自己查出来。

              让计划具备决策完备性：写明目标与成功标准；按子系统对实施改动分组；标明公开 API、schema 与数据流变化；覆盖边界情况、失败模式、测试、验收标准与显式假设。保持足够简洁以便评审，又足够详细让另一位工程师无需再做设计决策即可实施。

              就绪后，调用 exit_plan_mode 并附上完整计划 markdown，以 # 标题开头。让 exit_plan_mode 成为该次助手回复中唯一且最后一次工具调用：它把计划提交审批，实施只在获批之后的后续步骤中开始。不要把最终计划作为普通回复粘贴，也不要用散文或 ask_user_question 问「我是否可以继续？」。如果评审驳回，吸收反馈后再次提交。如果评审通道不可用或已中止，保持计划模式并让用户手动切换模式；不要继续实施。

# ── 压缩 ─────────────────────────────────────────────────────────────────────

# `compaction-basic` 通过 `ctx.get` 读取 `toolResultPrune`，因此 pruner 必须
# 共享该领域，而不是放在它外面。
#
# `tokenMeter` 刻意不放在该领域：计量器留在 HOST 平面，这里的行解析那一个实例。
# 它无需配置，按 Session 给每次折叠按键，并拥有浏览器为每个会话读取的上下文
# 计量投影单元——放在领域后，这些单元会随恰好挂载了哪些 preset 而来去。preset
# 要选择的是：它的 agent 是否压缩，也就是下面的 `compaction-basic`。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    # 中文压缩引擎：继承官方 compaction-basic，仅把摘要指令换成中文（否则压缩摘要会以英文生成）。
    - id: zh-compaction
      name: 'dsh-zh-compaction'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── 委派与工作流 ─────────────────────────────────────────────────────────────

# `subagents` 注册表及其 spawn/fork 后端位于 HOST 组合：注册表是进程单例，其
# 跨会话查询由 api-proxy 服务给浏览器，而 provider 名称只能注册一次。本 preset
# 贡献的是委派工具，它们解析那个宿主注册表。
#
# `workflows` 则不同——没有任何 agent 外部的东西读取它——所以每个触达它的行
# 都在这里共享一个 entry-local 领域，而留在外面的消费者会解析到一个本 preset
# 并未填充的宿主注册表。
#
# `tool-subagent-report` 出于与注册表相同的原因属于 host 平面，而不是因为某个
# preset 不想要它：它在那个单例上注册一个可继续的 SETUP，而不是这个 agent 调用
# 的工具，而且 setup 列表不感知 scope——每个挂载的 preset 一份，意味着每个子代
# 都会按每个活动会话注册一次 `report`，第二次就会抛错。
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # 产品 provider 是宿主平面单例。复制本 preset 后，从任一普通工具行移除
    # `disabled`，即可只对由该副本组合出的 agent 暴露该产品。
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── 其余面向模型的行 ────────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# `web` 服务及其搜索 provider 留在宿主组合；只有面向模型的工具是每会话的。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 自修改 ───────────────────────────────────────────────────────────────────

# 读取活动运行时、挂载临时插件、再卸载。该工具集是信任边界，而不是沙箱——
# 见本文件开头。
#
# 说明：`tool-cordis` 注册的 Host 运行时检查器（Cordis inspect provider）是进程
# 级单例，同一进程内只能有一个实例。原 `cordis`（创造模式）已占用该单例，本
# 中文副本因此将它禁用，以避免挂载冲突；需要在线运行时检查 / 插件实验时，请
# 使用原「创造模式」。
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
  disabled: true

# 组合创作技能随该 preset 一起分发，而不是住在用户的技能根目录：它记录的是
# 本部署的两个平面，而 preset 正是被复制与编辑的单元。`baseUrl` 是 preset 自己
# 的目录，因此该根会随 preset 安装位置而解析。
# 两行都注册进该 preset 在宿主技能注册表里的那一层，因此无需领域；agent 合并后
# 的目录还带有部署全局注册的任何东西（仓库插件）。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
